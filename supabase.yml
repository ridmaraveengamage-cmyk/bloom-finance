# Sets up the Supabase database and sign-in settings automatically.
# Runs when database files change on main, or when you press "Run workflow".
# All passwords and keys come from GitHub secrets. None are stored in the repository.
name: Supabase setup
on:
  push:
    branches: ["main"]
    paths: ["supabase/migrations/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SITE_URL: ${{ vars.SITE_URL }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required settings
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD(secret)"
          [ -n "$PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF(variable)"
          [ -n "$SITE_URL" ] || missing="$missing SITE_URL(variable)"
          if [ -n "$missing" ]; then echo "::error::Add these in Settings → Secrets and variables → Actions:$missing"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Build sign-in settings
        run: |
          SITE="${SITE_URL%/}"
          mkdir -p supabase
          {
            echo 'project_id = "bloom-finance"'
            echo ''
            echo '[auth]'
            echo "site_url = \"$SITE\""
            echo "additional_redirect_urls = [\"$SITE\", \"$SITE/\"]"
          } > supabase/config.toml
          if [ -n "$SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID" ] && [ -n "$SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET" ]; then
            printf '\n[auth.external.google]\nenabled = true\nclient_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"\nsecret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"\n' >> supabase/config.toml
            echo "Google sign-in: will be switched on"
          else echo "::warning::Google sign-in skipped: add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET secrets"; fi
      - name: Connect to your Supabase project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database changes
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Apply sign-in settings
        run: supabase config push --project-ref "$PROJECT_REF" --yes
