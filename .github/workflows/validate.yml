name: Validate Bloom Finance
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.current = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script" and not dict(attrs).get("src"):
                      self.inside = True
                      self.current = []
              def handle_data(self, data):
                  if self.inside:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.inside:
                      self.scripts.append("".join(self.current))
                      self.inside = False
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline scripts found")
          for i, script in enumerate(parser.scripts, 1):
              Path(f"/tmp/bloom-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(parser.scripts)} inline script(s)")
          PY
          for f in /tmp/bloom-inline-*.js; do node --check "$f"; done
      - name: Check required finance features are present
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          checks = {
              "transaction editing": "function openTransactionForm(editId)",
              "credit cards": "function openCardForm()",
              "credit-card balance calculation": "function cardCurrent(c)",
              "accounts and cards navigation": "Accounts and Cards",
              "card debt in overview": "Credit-card outstanding",
          }
          missing = [name for name, needle in checks.items() if needle not in s]
          if missing:
              raise SystemExit("Missing expected features: " + ", ".join(missing))
          print("Required feature checks passed")
          PY
